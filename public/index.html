<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Send a message</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --card: #ffffff;
      --text: #1b2430;
      --muted: #5f6b7a;
      --accent: #1f6feb;
      --ok: #1a7f4b;
      --err: #c0392b;
      --border: #cfd6de;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12161c;
        --card: #1b212a;
        --text: #e8ecf1;
        --muted: #9aa5b3;
        --accent: #5c9dff;
        --ok: #4cc38a;
        --err: #ff7b6b;
        --border: #354050;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1rem;
    }

    form {
      width: 100%;
      max-width: 50rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: grid;
      gap: 0.75rem;
    }

    h1 { margin: 0; font-size: 1.25rem; }

    input, button {
      font: inherit;
      padding: 0.65rem 0.8rem;
      border-radius: 8px;
    }

    input {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
    }

    input:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button {
      border: 0;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }

    #status { margin: 0; min-height: 1.25rem; font-size: 0.9rem; color: var(--muted); }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }
  </style>
</head>
<body>
  <form id="form">
    <h1>🎤  Enter Your Question :</h1>
    <input id="message" name="message" type="text" placeholder="Type something…" autocomplete="off" required />
    <button type="submit" id="send">Send</button>
    <textarea id="status" role="status"  rows="25" cols="300"></textarea>
  </form>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const button = document.getElementById("send");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      button.disabled = true;
      status.className = "";
      status.textContent = "Sending…";

      try {
        const res = await fetch("http://localhost:8000/api/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: input.value }),
        });
        const data = await res.json();

        console.log(">>>>>>>>>>>",data)

        if (!res.ok) throw new Error(data.error || "Request failed.");

        status.className = "ok";
        status.textContent = "Sent: " + data.received;
        input.value = "";
      } catch (err) {
        status.className = "err";
        status.textContent = err.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
